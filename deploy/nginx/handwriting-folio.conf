# Nginx reverse proxy for Handwriting Folio (PRD §10.3).
#
# Install:
#   sudo cp deploy/nginx/handwriting-folio.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/handwriting-folio.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace `folio.example.com` with your domain (or the VPS IP if you have
# no domain). For HTTPS, run Certbot afterwards — it edits this file:
#   sudo certbot --nginx -d folio.example.com

upstream handwriting_folio {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name folio.example.com;

    # Input is capped at 10k chars; 1m matches express.json({ limit: '1mb' }).
    client_max_body_size 1m;

    # ── Access protection: pick ONE ──
    # (a) App-level basic auth: set BASIC_AUTH_PASS in .env (default, nothing to do here).
    # (b) Nginx basic auth: leave BASIC_AUTH_PASS empty in .env and uncomment:
    #       sudo apt install apache2-utils
    #       sudo htpasswd -c /etc/nginx/.htpasswd-folio teman
    # auth_basic           "Handwriting Folio";
    # auth_basic_user_file /etc/nginx/.htpasswd-folio;

    location / {
        proxy_pass http://handwriting_folio;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # The app's rate limiter uses X-Forwarded-For (requires TRUST_PROXY=1 in .env).
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long texts (multi-page, debug mode) can take a few seconds to render.
        proxy_read_timeout 60s;
    }

    # Uptime checks don't need a password.
    location = /api/health {
        auth_basic off;
        proxy_pass http://handwriting_folio;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    # Response JSON is mostly base64 JPEG, so gzip only helps a little. Keep it cheap.
    gzip_comp_level 3;
}
